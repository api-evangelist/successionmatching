aid: successionmatching
name: SuccessionMatching
description: SuccessionMatching is an online community platform that connects business buyers, sellers,
  and succession planning professionals to facilitate ownership transitions of businesses and farms. The
  platform uses a compatibility matching algorithm to pair buyers and sellers, offers customizable privacy
  settings, commission-free sales for owners, educational resources on succession planning and business
  valuation, and a formal succession planning program that guides owners through selling their business.
  A Techstars-backed company operating a members-only web application, it currently exposes no public
  developer or API surface.
